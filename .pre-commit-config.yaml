repos:
  - repo: local
    hooks:
      - id: fourmolu
        name: Format Haskell with Fourmolu
        entry: fourmolu --mode inplace
        language: system
        files: ^critters/.*\.(hs|hs-boot|hsig)$
        require_serial: true
      - id: schema
        name: Generate schema
        entry: bash -c 'cd critters && exec cabal run -v0 critters-schema > schema.json'
        language: system
        files: ^critters/(.*\.(cabal|hs|hs-boot|hsig)|schema\.json)$
        pass_filenames: false
        require_serial: true
      - id: test
        name: Test
        entry: just test
        language: system
        files: ^critters/.*\.(cabal|hs|hs-boot|hsig)$
        pass_filenames: false
        require_serial: true
